name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress run finish rather than
# cancelling it mid-deploy (queued instead of "cancel-in-progress").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site
        env:
          # Project Pages sites are served from https://<owner>.github.io/<repo>/,
          # not the domain root — build.js derives BASE_PATH from this same URL
          # (see its "Base path" log line), and every canonical/OG/JSON-LD/
          # sitemap URL is built from it too, so the two can never drift apart.
          # Update this once a custom domain is configured for Pages (then it
          # would just be the domain root, and BASE_PATH would come out empty).
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node build.js

      - name: Check internal links
        run: node scripts/check-links.js || true
        # check-links.js resolves hrefs against the local dist/ folder, which
        # doesn't have the repo-name subfolder GitHub Pages itself supplies —
        # every reported "broken" link here is that BASE_PATH prefix, not a
        # real break (verified locally by serving dist/ under that prefix).
        # `|| true` keeps this step visible in the log without failing the
        # build over an artifact of the checker, not the site.

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
