# Builds the site and publishes dist/ to GitHub Pages.
# Repo Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run build
        env:
          # A GitHub Pages project site (no custom domain) is served from
          # https://<owner>.github.io/<repo>/, not the domain root — this
          # overrides data/site.json's `url` for this build only, so every
          # internal link, the manifest and the service worker pick up the
          # right base path (see scripts/build.js's SITE_URL). Once a custom
          # domain is set up for Pages, drop this env var (or point it at
          # the domain) and site.json's own `url` takes over again.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
